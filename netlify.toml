# Netlify configuration, read from the repository root.
# The site lives in the `web/` sub-folder of the monorepo: Netlify moves there
# before installing and building. `publish` is relative to that base folder.
# Settings here override the ones in the Netlify UI.

[build]
  base = "web"
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # Plain static site: Netlify's Next.js plugin would look for a server build
  # and fail on the `out` folder. pnpm's version comes from package.json
  # ("packageManager"), installed by Corepack.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# --- Language on arrival -------------------------------------------------
# "/" goes to /fr for French-speaking browsers, /en for everyone else.
# `force` is needed because out/index.html (the JavaScript fallback) exists.
[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  force = true
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true

# --- Project list: on the home page since 2026-10-28 -----------------------
# The old catalogue pages (/fr/demos, /fr/realisations and their English
# twins) go to the home page; project pages keep /fr/realisations/<slug>.
[[redirects]]
  from = "/fr/realisations"
  to = "/fr"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/fr/demos"
  to = "/fr"
  status = 301
  force = true

[[redirects]]
  from = "/en/demos"
  to = "/en"
  status = 301
  force = true

# Old project pages: "demos" became "realisations" (FR) / "projects" (EN), D-021.
# Project slugs did not change, so the splat carries over.
[[redirects]]
  from = "/fr/demos/*"
  to = "/fr/realisations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/demos/*"
  to = "/en/projects/:splat"
  status = 301
  force = true

# --- Security and cache headers ------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
