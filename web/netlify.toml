# Netlify configuration. In the Netlify UI, set "Base directory" to `web`
# (the site lives in a sub-folder of the monorepo); paths below are relative to it.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # Plain static site: Netlify's Next.js plugin would look for a server build
  # and fail on the `out` folder. pnpm's version comes from package.json
  # ("packageManager"), installed by Corepack.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# --- Language on arrival -------------------------------------------------
# "/" goes to /fr for French-speaking browsers, /en for everyone else.
# `force` is needed because out/index.html (the JavaScript fallback) exists.
[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  force = true
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true

# --- Security and cache headers ------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
